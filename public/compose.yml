# SaamSaam — PUBLIC services. Only on a host that has none of its own.
#
#   cd public && docker compose --env-file ../.env -f compose.yml up -d
#
# --env-file is mandatory. Compose resolves ${...} from the .env beside the
# first -f argument — public/, not the repo root — so without it there is no
# interpolation source at all. The credentials use ${VAR:?...} so that a
# forgotten --env-file fails immediately rather than initialising a database
# with an empty password.
#
# The path is relative to your WORKING DIRECTORY, not to this file, which is
# why the command above cd's into public/ first. From the repo root the same
# file needs --env-file .env; ../.env there resolves outside the repo entirely.
#
# Data goes under HOST_DATA_ROOT, not PROJECT_DATA_ROOT: a postgres data
# directory holds a whole cluster, so every project's databases share one.
#
# Do not run this on a host that already provides these services. Two postgres
# containers on one network cannot both answer to the same name, so you would
# either get a name collision or the wrong database.

name: ${PROJECT_NAME:-saamsaam}-public

# One network for everything, external, created by svc-start.sh. See compose.yml.
networks:
  backend-net:
    external: true
    name: ${SHARED_NETWORK:-backend-net}

services:
  # ═══════════════════════════════════════════════════
  # nginx
  # ═══════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: ${NGINX_HOST:-nginx}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
    # Port 80 only. TLS is terminated by the Cloudflare tunnel in front of this,
    # and nginx.conf has never had a `listen 443`, so publishing 443 and mounting
    # a certs directory only bought someone an evening working out why
    # https://<box>:443 answers nothing. The tunnel dials the published port on
    # the host — on a WSL box that is reachable from Windows over localhost, which
    # is how a cloudflared running as a Windows service reaches this nginx.
    ports:
      - "8080:80"
    networks: [backend-net]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # ONE bundle directory. A box runs one instance, so there is no
      # html/saamsaam-staging beside it to fall out of step with.
      - ./nginx/html/saamsaam:/usr/share/nginx/html/saamsaam:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }

  # ═══════════════════════════════════════════════════
  # postgres — DB/USER/PASSWORD apply on first boot only
  # ═══════════════════════════════════════════════════
  postgres:
    image: postgres:18.4-alpine
    container_name: ${POSTGRES_HOST:-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?not set — run this from public/ with --env-file ../.env}
      POSTGRES_USER: ${POSTGRES_USER:?not set — run this from public/ with --env-file ../.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?not set — run this from public/ with --env-file ../.env}
      PGPORT: ${POSTGRES_PORT:-5432}
      TZ: ${TZ:-Africa/Johannesburg}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:${POSTGRES_PORT:-5432}"
    networks: [backend-net]
    volumes:
      # Postgres 18 moved PGDATA into a version-specific subdir and expects the
      # volume mounted at the parent /var/lib/postgresql (NOT /var/lib/postgresql/data,
      # the pre-18 convention). Mounting at .../data makes initdb refuse to start
      # ("data appears in an unused mount/volume"). The host dir then holds
      # <root>/postgres/18/docker/... — a bare/empty dir initialises cleanly.
      - ${HOST_DATA_ROOT:-/srv/data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }

  # ═══════════════════════════════════════════════════
  # redis — password-protected, matching the shared providers
  #
  # --requirepass mirrors local-infra / gentick-infra so the API's
  # REDIS_PASSWORD works the same whether it dials this standalone
  # redis or a shared one. ${VAR:?...} fails the bring-up loudly if
  # --env-file was forgotten, rather than starting an open redis the
  # API then can't authenticate against.
  #
  # Port and password are both command flags, not env vars: redis has
  # no PGPORT/PGPASSWORD equivalent. And unlike pg_isready, redis-cli
  # does NOT pick the port up implicitly — with no -p it tries 6379 and
  # fails, so moving REDIS_PORT without the flag below would mark a
  # perfectly healthy redis unhealthy forever. The healthcheck must
  # authenticate too (-a), or it reports NOAUTH and never goes healthy.
  # ═══════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_HOST:-redis}
    restart: unless-stopped
    command: ["redis-server", "--port", "${REDIS_PORT:-6379}", "--requirepass", "${REDIS_PASSWORD:?not set — run this from public/ with --env-file ../.env}"]
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:${REDIS_PORT:-6379}"
    networks: [backend-net]
    volumes:
      - ${HOST_DATA_ROOT:-/srv/data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_PORT:-6379} -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }
