# ============================================================
# SaamSaam — nginx configuration (one instance per box)
#
# One app, one server block. The box serves SaamSaam on whatever
# hostname reaches it (server_name _), because a box runs exactly one
# SaamSaam instance — there is no staging-vs-live split to route between
# any more. The box's public identity (the domain in emailed links) is
# PUBLIC_BASE_URL in the api's .env, not here.
#
# Upstream is the CONTAINER name, not the service name. nginx lives in
# the public/ compose project and the api lives in the private one;
# compose gives a container both its container name and its service name
# as network aliases, so either resolves across projects — but the bare
# service name `api` would collide with any other stack on this network.
# The prefixed container name will not.
#
# TLS is terminated by the Cloudflare tunnel in front of this, so this
# listens on 80.
# ============================================================

resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 80 default_server;
  server_name _;

  location /healthz {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  location /api/ {
    set $upstream "http://saamsaam-api:8080";
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  root /usr/share/nginx/html/saamsaam;
  index index.html;

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  location ~ ^/(flutter_bootstrap\.js|index\.html)$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  location = /main.dart.js {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  location ~ \.(js|json|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri /index.html;
  }

  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri /index.html;
  }

  location / {
    try_files $uri /index.html;
  }
}
