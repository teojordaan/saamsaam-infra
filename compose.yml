# SaamSaam — PRIVATE services. Always ours, on every host.
# Backing services live in public/compose.yml. See svc-start.sh for the split.
#
#   docker compose --env-file .env -f compose.yml up -d
#
# Image tags and container names live here rather than in .env: commit -> push
# -> pull is the only way anything reaches a server, so a tag in a tracked file
# makes the deployed version visible in git history. .env is for credentials.

name: ${PROJECT_NAME:-saamsaam}

# One network for everything, external, created by svc-start.sh.
#
# gentick-infra owns this network and names it explicitly, so it is plain
# `backend-net` rather than that project's prefixed one. Compose has no
# conditional and refuses to adopt a network it did not create, so "use it if it
# exists, otherwise make it" cannot be expressed here — the script does it.
# Starting by hand needs the network first:
#   docker network create backend-net
networks:
  backend-net:
    external: true
    name: ${SHARED_NETWORK:-backend-net}

services:
  # ═══════════════════════════════════════════════════
  # api — REST API (live)
  # ═══════════════════════════════════════════════════
  api:
    image: ghcr.io/teojordaan/saamsaam-api:0.2.2
    container_name: ${PROJECT_NAME:-saamsaam}-api
    restart: unless-stopped
    env_file: [.env, .env.live]
    # The api reads API_JWT_SECRET; .env declares it as API_JWT_SECRET_SAAMSAAM
    # so it cannot collide with another app's signing key in the shared creds
    # directory. `environment:` outranks `env_file:`, so this is the mapping.
    environment:
      API_JWT_SECRET: ${API_JWT_SECRET_SAAMSAAM:?not set — is .env built?}
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-8080}/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: { driver: "local", options: { max-size: "2m", max-file: "3" } }

  # ═══════════════════════════════════════════════════
  # api-staging — same image, staging tag and database
  # ═══════════════════════════════════════════════════
  api-staging:
    image: ghcr.io/teojordaan/saamsaam-api:0.2.3
    container_name: ${PROJECT_NAME:-saamsaam}-api-staging
    restart: unless-stopped
    env_file: [.env, .env.staging]
    # Same mapping as live — staging signs with the same key, because it is the
    # same application. See the api service above.
    environment:
      API_JWT_SECRET: ${API_JWT_SECRET_SAAMSAAM:?not set — is .env built?}
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-8080}/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: { driver: "local", options: { max-size: "2m", max-file: "3" } }
