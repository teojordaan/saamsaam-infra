# SaamSaam — docker-compose stack (Windows + WSL).
#
# This file describes the WHOLE stack so it can be deployed on any server and
# just run. A host that already provides shared services runs only the private
# group; a bare host runs everything. See svc-start.sh for the split.
#
#   private   go-api, go-api-staging   — always ours
#   public    postgres, redis, nginx   — only when the host has none
#
# The public services are not redundant. They are what makes a standalone
# deploy possible, and removing them would mean this stack only works on a box
# that happens to already have a database.
#
# All env-specific values come from --env-file. Secrets come from certs/ via
# build-env.py.
#
# Bring up via: svc-start.sh

name: ${COMPOSE_PROJECT_NAME:-saamsaam}

networks:
  # Ours. Only this stack's services sit here.
  saamsaam-net:
    driver: bridge

  # Shared. Owned by teo-infra (or gentick-infra) when one is running, which is
  # why it is external: this stack joins it, never creates it. The api sits on
  # both, so it reaches whichever postgres is answering by the same name.
  #
  # Standalone, nothing owns it — create it once with:
  #   docker network create backend-net
  backend-net:
    external: true
    name: ${SHARED_NET:-backend-net}

volumes:
  redis-data:
    driver: local

services:

  # ═══════════════════════════════════════════════════
  # postgres — PUBLIC group. Only runs on a host with no shared postgres.
  #
  # It sits on backend-net under the alias `postgres`, exactly as teo-infra's
  # does, so PG_HOST=postgres resolves to whichever one is running. That is the
  # whole point of the split: swapping shared for standalone must not require an
  # env change. The database name must match teo-infra's for the same reason.
  # ═══════════════════════════════════════════════════

  postgres:
    image: postgres:17-alpine
    container_name: ${CONTAINER_PREFIX:-saamsaam}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-saamsaam}
      POSTGRES_USER: ${PG_USER:-saamsaam}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      - ${HOST_DATA_ROOT:-/mnt/main-drive}/postgres:/var/lib/postgresql/data
    # Loopback only: reachable by `psql -h 127.0.0.1` once you are SSH'd into
    # the box, and by tests running outside Docker — but never from off the
    # machine. The port is a variable because live and staging share a host.
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    networks:
      saamsaam-net:
      backend-net:
        aliases: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }

  # ═══════════════════════════════════════════════════
  # redis — PUBLIC group. Same reasoning as postgres above.
  # ═══════════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-saamsaam}-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks:
      saamsaam-net:
      backend-net:
        aliases: [redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }

  # ═══════════════════════════════════════════════════
  # go-api — REST API (env-specific image tag)
  # ═══════════════════════════════════════════════════

  go-api:
    image: ghcr.io/teojordaan/saamsaam-api:${API_IMAGE_TAG:-0.0.1}
    container_name: ${CONTAINER_PREFIX:-saamsaam}-api
    restart: unless-stopped
    env_file:
      - .env
      - .env.live
    environment:
      API_PORT: 8080
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # depends_on only applies when the public group is running too. In private
    # mode svc-start.sh passes --no-deps, or compose would drag postgres and
    # redis up and defeat the whole split.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Both networks: saamsaam-net to be reachable by our nginx, backend-net to
    # reach the shared postgres/redis by name.
    networks: [saamsaam-net, backend-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: { driver: "local", options: { max-size: "2m", max-file: "3" } }

  # ═══════════════════════════════════════════════════
  # go-api-staging — staging REST API (same image, staging tag)
  # ═══════════════════════════════════════════════════

  go-api-staging:
    image: ghcr.io/teojordaan/saamsaam-api:${STAGING_API_IMAGE_TAG:-0.0.1}
    container_name: ${STAGING_CONTAINER_PREFIX:-saamsaam-staging}-api
    restart: unless-stopped
    env_file:
      - .env
      - .env.staging
    environment:
      API_PORT: 8080
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # depends_on only applies when the public group is running too. In private
    # mode svc-start.sh passes --no-deps, or compose would drag postgres and
    # redis up and defeat the whole split.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Both networks: saamsaam-net to be reachable by our nginx, backend-net to
    # reach the shared postgres/redis by name.
    networks: [saamsaam-net, backend-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: { driver: "local", options: { max-size: "2m", max-file: "3" } }

  # ═══════════════════════════════════════════════════
  # nginx — PUBLIC group. Serves the Flutter web build and reverse-proxies
  # /api/ to go-api, with one config carrying both the staging and production
  # server blocks.
  #
  # Only runs on a standalone host. Where teo-infra is running, its nginx
  # serves the frontend from teo-infra/nginx/html and this one stays down —
  # the build still lands in ./nginx/html here first and is copied across.
  # ═══════════════════════════════════════════════════

  nginx:
    image: nginx:alpine
    container_name: ${CONTAINER_PREFIX:-saamsaam}-nginx
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
      # Single nginx config with both server blocks
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Both frontend builds — staging and production
      - ./nginx/html/SaamSaam:/usr/share/nginx/html/SaamSaam:ro
      - ./nginx/html/SaamSaam-staging:/usr/share/nginx/html/SaamSaam-staging:ro
    depends_on:
      go-api: { condition: service_started }
      go-api-staging: { condition: service_started }
    networks: [saamsaam-net]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: { driver: "local", options: { max-size: "1m", max-file: "3" } }
