# ============================================================
# SaamSaam — nginx configuration (dual domain)
#
# sm.teojordaan.com     → staging (default server)
# saamsaam.archyta.com  → production
#
# Volume mounted into the container at /etc/nginx/conf.d/.
# ============================================================

resolver 127.0.0.11 ipv6=off valid=10s;

# ── STAGING (default server) ────────────────────────────
server {
  listen 80 default_server;
  server_name sm.teojordaan.com;

  location /healthz {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  location /api/ {
    set $upstream "http://go-api-staging:8080";
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  root /usr/share/nginx/html/SaamSaam-staging;
  index index.html;

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  location ~ ^/(flutter_bootstrap\.js|index\.html)$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  location = /main.dart.js {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  location ~ \.(js|json|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri /index.html;
  }

  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri /index.html;
  }

  location / {
    try_files $uri /index.html;
  }
}

# ── PRODUCTION ─────────────────────────────────────────
